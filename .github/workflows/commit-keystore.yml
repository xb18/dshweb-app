name: 一次性提交签名 keystore
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 生成并提交 keystore 到仓库
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/app.jks \
            -alias "$KEYALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -dname "CN=xb18, OU=app, O=xb18, L=CN, ST=CN, C=CN" >/dev/null 2>&1
          B64=$(base64 -w0 /tmp/app.jks)
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/android/app/keystore.jks" \
            -d "{\"message\":\"chore(android): 提交固定签名 keystore\",\"content\":\"$B64\",\"branch\":\"main\"}"
          rm -f /tmp/app.jks
          gh secret delete BOOTSTRAP_TOKEN --repo "$GITHUB_REPOSITORY" || true
          echo "keystore 已提交，BOOTSTRAP_TOKEN 已删除"
